name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kirillova/buildozer-action@v1
        with:
          command: android debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          
        
        

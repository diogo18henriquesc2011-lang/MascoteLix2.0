name: Compilar APK do Axolote

on:
  push:
    branches: [ main, principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compilar com Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        command: android debug
        
    - name: Guardar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: meu-mascote-apk
        path: bin/*.apk
        
